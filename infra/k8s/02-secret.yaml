# infra/k8s/02-secret.yaml
#
# *** TEMPLATE ONLY - every value below is a placeholder, not a real
# secret. Do not apply this file as-is to any real cluster. ***
#
# This exists to document the shape (keys) of the Secret that api/worker's
# `envFrom.secretRef` (10-api.yaml / 20-worker.yaml) expects, named
# `epub2pdf-secrets`. Populate it one of these ways instead of committing
# real values into this file:
#   - `kubectl create secret generic epub2pdf-secrets -n epub2pdf \
#        --from-literal=POSTGRES_URL=... --from-literal=REDIS_URL=... ...`
#     and never `git add` the result, or
#   - a secrets manager integration (Sealed Secrets, External Secrets
#     Operator + AWS/GCP/Vault, SOPS, etc.) that renders this shape from an
#     encrypted source, or
#   - your CI/CD system injecting it at deploy time.
#
# `stringData` (plaintext here, base64-encoded by the API server on write)
# is used instead of `data` purely so this template stays human-editable;
# it has no bearing on how the secret is stored at rest.
apiVersion: v1
kind: Secret
metadata:
  name: epub2pdf-secrets
  namespace: epub2pdf
  labels:
    app.kubernetes.io/part-of: epub2pdf-platform
type: Opaque
stringData:
  # --- Postgres ---
  # Full connection string - packages/{api,worker}/src/db/pool.js passes
  # this straight to `new pg.Pool({ connectionString })`.
  POSTGRES_URL: "postgres://CHANGEME_USER:CHANGEME_PASSWORD@CHANGEME_HOST:5432/epub2pdf"

  # --- Redis / BullMQ ---
  REDIS_URL: "redis://CHANGEME_HOST:6379"

  # --- S3 / MinIO-compatible storage ---
  S3_ACCESS_KEY_ID: "CHANGEME"
  S3_SECRET_ACCESS_KEY: "CHANGEME"

  # --- API bootstrap keys (dev/staging convenience only) ---
  # packages/api/src/lib/apiKeys.js's bootstrapDevKeys() only runs when
  # NODE_ENV != "production" (see packages/api/src/index.js) AND the
  # api_keys table is empty - so with NODE_ENV=production set in
  # 01-configmap.yaml, this key is a NO-OP in prod. Real production API
  # keys must be inserted directly into the api_keys table per
  # docs/API_CONTRACT.md's Auth section (Phase 1 behavior - there's no
  # admin endpoint yet). Left here for staging/dev environments that run
  # with NODE_ENV unset or "development".
  API_KEYS_BOOTSTRAP: "CHANGEME_comma,separated,raw,keys"

  # --- Webhooks ---
  # Used to HMAC-sign outbound webhook deliveries (packages/shared/src/hmac.js).
  # Generate a real per-environment secret, e.g. `openssl rand -hex 32`.
  WEBHOOK_SIGNING_SECRET: "CHANGEME"

  # --- Observability (optional; leave blank to disable, per .env.example) ---
  SENTRY_DSN: ""
  DATADOG_API_KEY: ""
